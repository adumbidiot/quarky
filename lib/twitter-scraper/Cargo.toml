[package]
name = "twitter-scraper"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
cookie_store = "0.22.1"
form_urlencoded = "1.2.2"
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [ "cookies", "json" ] }
reqwest_cookie_store = "0.10.0"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = "1.53.1"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = [ "macros" ] }

[features]
default = ["reqwest/default-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
